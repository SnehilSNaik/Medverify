server.port=8080

# Primary MySQL config (Uncomment if MySQL service is running on localhost:3306)
# spring.datasource.url=jdbc:mysql://localhost:3306/medverify?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# H2 In-Memory Database (Default for instant zero-config startup)
spring.datasource.url=jdbc:h2:mem:medverify;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Jackson - serialize dates as ISO strings, not timestamps
spring.jackson.serialization.write-dates-as-timestamps=false

jwt.secret=MedVerifySecretKey2024SuperSecureHashing256BitsLong
jwt.expiration=900000
jwt.refresh-expiration=604800000

crypto.aes-secret=MedVerifyAES256!

app.base-url=http://localhost:8080
cors.allowed-origins=http://localhost:5173,http://localhost:3000

logging.level.com.medverify=INFO
